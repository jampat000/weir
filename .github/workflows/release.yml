# Tag-driven release: push tag vX.Y.Z or vX.Y.Z-rc.N -> CI proof, Windows installer, Docker image, GitHub Release.
# A tag with a pre-release part (v1.0.0-rc.1) publishes a GitHub pre-release; a plain vX.Y.Z publishes a normal release.
#
# Every job but the two publish jobs starts at once and none of them can publish anything:
#
#   ci-passed         ci.yml's ci-passed job already passed on this exact commit
#                     (scripts/verify-ci-for-release.mjs), so the release does not repeat CI's tests.
#   golden-path       for every tag, release candidates included, Weir's scenario suite already passed on this exact
#                     commit: a `golden-path` commit status of `success` on it
#                     (scripts/verify-golden-path-for-release.mjs, docs/release.md). Nothing skips it.
#   validate          release-only checks: notes file, gate ordering, dependency advisories as of
#                     today, the E2E smoke, and the production web build that ships as an asset.
#   windows-smoke     builds, smokes and uploads the Windows package (artifact, not public).
#   docker-candidate  builds the linux/amd64 image unpushed and runs the full live E2E against it.
#   docker-arm64      builds the linux/arm64 image unpushed (QEMU).
#
# Two jobs publish, one per thing published. Neither waits for the other, so a slow or failed Docker build never
# holds back the Windows release that installed Weirs update from, and either can be re-run alone:
#
#   publish-windows   needs ci-passed, golden-path, validate and windows-smoke. It alone has `contents: write` and
#                     publishes the GitHub Release: the Windows installer and update files, the web build and
#                     the release notes, which name the Docker image.
#   publish-docker    needs ci-passed, golden-path, validate, docker-candidate and docker-arm64. It alone holds
#                     registry credentials and `packages: write`. It pushes only the version tag, smokes that
#                     image, and only then moves the moving tags (`major.minor` and `latest`). A release
#                     candidate moves none.
#
# Nothing reaches ghcr or the Releases page unless every check its job needs passed. Signed provenance attestations
# for the image and the release files are switched by the repository variable ATTEST_PROVENANCE.
# scripts/check-release-workflow-gates.mjs enforces that shape.
name: Release

on:
  push:
    tags:
      - "v*"

# One release per tag at a time, and a release that has started is never cancelled: stopping a publish job
# halfway could leave an image pushed but never smoked, or a Release with only some of its files. A second run
# for the same tag (a re-run, a re-pushed tag) waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The tag that triggered this run, named explicitly here rather than read from the runner's
  # ambient GITHUB_REF_NAME in each step: every step below that needs the tag gets it the same
  # declared way as every other value this workflow passes around.
  TAG: ${{ github.ref_name }}

jobs:
  # Does not wait: a tag is made after CI is green on that commit, and one made while CI is still running fails at
  # once. It fails with the fix (wait for CI, or run ci.yml by hand on the tag, then re-run this release).
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ci.yml passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci-for-release.mjs

  # Does not wait either: for every tag, a release candidate too, Weir's scenario suite is run on this commit's own
  # build on the golden VM before the tag is made, and the run recorded the result as a commit status. A tag made
  # without a passing one fails at once, saying what to run. There is no pass-through and no waiver (#954;
  # docs/release.md, "Proof before tagging"). The job has no `if:` and release-workflow-gates keeps it that way.
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The golden path passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-golden-path-for-release.mjs

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        shell: bash
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate release version alignment
        shell: bash
        run: node scripts/check-release-version.mjs "$TAG"

      # The delta base for `vpk pack` below: the newest published release that is OLDER than this one by
      # SemVer precedence, pre-releases included (scripts/find-previous-release.mjs). Never "the latest
      # release": that can be a pre-release or a newer version, and neither is a valid base. Empty when
      # nothing older is published, and build-velopack.ps1 then packs the full package alone (docs/release.md).
      - name: Previous release version
        id: previous
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' \
            | node scripts/find-previous-release.mjs "${{ steps.version.outputs.plain }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: |
            apps/server/**/packages.lock.json
            apps/tray/**/packages.lock.json

      # Same caches as ci-packaging.yml: both FFmpeg and MKVToolNix are pinned in
      # packaging/windows/build-velopack-vendored-media-tools.ps1 (dot-sourced from build-velopack.ps1),
      # so both keys come from that file's own pin. The build script re-checks the vendored copy either way.
      - name: FFmpeg build checksum
        id: ffmpeg
        shell: bash
        run: node scripts/ffmpeg-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ${{ runner.os }}-${{ steps.ffmpeg.outputs.key }}

      - name: Cache vendored MKVToolNix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/mkvtoolnix
          key: mkvtoolnix-vendor-${{ runner.os }}-${{ hashFiles('packaging/windows/build-velopack-vendored-media-tools.ps1') }}
          restore-keys: |
            mkvtoolnix-vendor-${{ runner.os }}-

      # Not cached: the bundled tools' source archives and the previous release's full nupkg would only
      # ever be saved under this tag's own ref, and GitHub never lets another tag's run restore a cache
      # saved there, so a cache could only ever miss. Both are downloaded fresh, with the progress bar
      # off, which is what made the downloads slow.

      # Builds the web app, publishes the .NET server (win-x64 single file) and the tray, vendors FFmpeg and
      # MKVToolNix, installs the pinned vpk CLI, fetches the previous release to diff against,
      # packs, and prunes that previous release's own package back out of the output (#804).
      - name: Build Weir Windows package (Velopack)
        env:
          WEIR_BUILD_VERSION: ${{ steps.version.outputs.plain }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1
          -PreviousReleaseRepoUrl "${{ github.server_url }}/${{ github.repository }}"
          -PreviousReleaseVersion "${{ steps.previous.outputs.version }}"

      # Defense in depth for the prune step build-velopack.ps1 just ran: fail here, before anything is
      # uploaded, rather than silently re-shipping a package for a version other than this release's.
      - name: Verify no other-version release assets
        shell: bash
        run: node scripts/check-release-assets-single-version.mjs dist/windows/releases "${{ steps.version.outputs.plain }}"

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1 -ExpectedVersion "${{ steps.version.outputs.plain }}"

      # Licence compliance: the exact corresponding source for the bundled LGPL FFmpeg and GPL
      # MKVToolNix binaries, hash-verified against the pins in
      # packaging/windows/build-velopack-vendored-media-tools.ps1, placed alongside the Windows
      # artifacts so they ride the same upload-artifact/attest/release steps below without a separate
      # publish path. The archives the build itself uses (Windows and Linux FFmpeg, Windows MKVToolNix) come
      # with them: upstream prunes old files, and a later build that finds one gone takes this copy from the
      # release instead (packaging/windows/pinned-download.ps1).
      - name: Fetch bundled tool archives and sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/fetch-bundled-tool-sources.ps1 -OutputDir dist/windows/releases

      - name: Generate release artifact checksums
        shell: powershell
        run: |
          $releasesDir = "dist/windows/releases"
          Get-ChildItem -Path $releasesDir -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath (Join-Path $releasesDir "SHA256SUMS.txt") -Encoding ascii
          }

      - name: Upload Velopack release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-velopack
          if-no-files-found: error
          path: dist/windows/releases/*

  # What CI cannot have proven: the artefacts built here, and advisories published since CI ran.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Checked first so a missing file fails in seconds, not after the builds; publish-windows reads it again.
      - name: Release notes file present
        run: |
          notes_file="docs/release-notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi

      - name: Release publication gate ordering
        run: node scripts/check-release-workflow-gates.mjs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # For the E2E smoke below (the solution includes its project). ci.yml already ran the server's tests on this commit (ci-passed).
      - name: Build Weir server (warnings are errors)
        working-directory: apps/server
        run: |
          dotnet restore Weir.slnx --locked-mode
          dotnet build Weir.slnx -warnaserror --no-restore

      # Advisories are published every day, so this is re-checked at release time, not taken from CI.
      - name: Server dependency vulnerability scan
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/server/Directory.Packages.props') }}

      - uses: ./.github/actions/apt-fail-fast

      # The install script is generated by the solution build above, for the Playwright version in
      # Directory.Packages.props. Its system libraries come from apt, told to retry and give up on a dead mirror
      # instead of waiting for the job's timeout.
      - name: Install the Playwright browser
        timeout-minutes: 10
        run: |
          pwsh apps/server/tests/Weir.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web build that ships as weir-web-dist.zip, with the release's VITE_SUPPORT_URL.
      - name: Weir web - production build
        working-directory: apps/web
        env:
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: |
          npm ci
          npm run build

      - name: Pack web dist
        run: |
          cd apps/web
          zip -r "$GITHUB_WORKSPACE/weir-web-dist.zip" dist

      # On push to main ci.yml skips its E2E smoke, so a release proves it here, against this build. Browser tests
      # retry once (docs/ci-standard.md): the retry step runs only the tests that failed in this first attempt.
      - name: Weir E2E smoke (Playwright + real .NET server)
        id: e2e
        continue-on-error: true
        working-directory: apps/server
        env:
          WEIR_E2E: "1"
        run: dotnet test tests/Weir.E2E.Tests --no-build --logger trx

      - name: Summarize E2E smoke results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-test-results.mjs trx apps/server/tests/Weir.E2E.Tests/TestResults "Browser smoke tests, first attempt"

      - name: Retry the failed E2E tests once
        if: ${{ steps.e2e.outcome == 'failure' }}
        env:
          WEIR_E2E: "1"
        run: node scripts/retry-failed-tests.mjs apps/server/tests/Weir.E2E.Tests "Browser smoke tests, retry"

      - name: Upload E2E smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/tests/Weir.E2E.Tests/TestResults*/*.trx

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-web-dist
          if-no-files-found: error
          path: weir-web-dist.zip

  # The linux/amd64 image, built and audited without credentials. Its layers go to this run's GitHub
  # Actions cache (not a registry), so publish-docker rebuilds from them instead of from scratch.
  docker-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-release-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/server/Directory.Packages.props') }}

      # The live audit generates its media fixtures with the host's ffmpeg.
      - uses: ./.github/actions/setup-ffmpeg-linux
        timeout-minutes: 10

      - uses: ./.github/actions/apt-fail-fast

      # The live audit (apps/server/tools/Weir.LiveAudit) is built here so the browser install can use the
      # script the build generates for its Playwright version, and the audit step does not compile mid-run.
      # The browser's system libraries come from apt, told to retry and give up on a dead mirror.
      - name: Build the live audit and install its browser
        timeout-minutes: 15
        run: |
          dotnet restore apps/server/tools/Weir.LiveAudit --locked-mode
          dotnet build apps/server/tools/Weir.LiveAudit -c Release --no-restore
          pwsh apps/server/tools/Weir.LiveAudit/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build unpushed Docker release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          build-args: WEIR_VERSION=${{ steps.version.outputs.plain }}
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}
          cache-from: type=gha,scope=weir-release-amd64
          cache-to: type=gha,mode=max,scope=weir-release-amd64,ignore-error=true

      # Before the candidate ever runs: a known HIGH/CRITICAL vulnerability with a fix already
      # available blocks the release outright. ignore-unfixed, because failing on something no
      # upstream fix exists for yet would just make every release wait on an unrelated CVE.
      - name: Trivy scan of Docker release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weir-release-candidate:${{ steps.version.outputs.plain }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start unpushed Docker release candidate
        run: |
          docker rm -f weir-release-candidate >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-release-candidate -p 9347:9347 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "weir-release-candidate:${{ steps.version.outputs.plain }}"
          node scripts/wait-for-health.mjs --container weir-release-candidate

      - name: Full live E2E against unpushed Docker release candidate
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:9347
          WEIR_LIVE_EXPECTED_VERSION: ${{ steps.version.outputs.plain }}
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-release-candidate-e2e
          # The container sees the audit's browser as the Docker bridge gateway, not loopback, so
          # bootstrap needs the one-time setup code; the audit reads it from this container's own log.
          WEIR_LIVE_E2E_DOCKER_CONTAINER: weir-release-candidate
        run: dotnet apps/server/tools/Weir.LiveAudit/bin/Release/net10.0/Weir.LiveAudit.dll

      - name: Upload Docker release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-release-candidate-audit
          if-no-files-found: warn
          path: artifacts/docker-release-candidate-e2e/*

      - name: Cleanup unpushed Docker release candidate
        if: always()
        run: docker rm -f weir-release-candidate >/dev/null 2>&1 || true

  # The arm64 variant of the same candidate must build before anything is pushed. Separate from the
  # amd64 job so its ~4 minutes under QEMU overlap everything else instead of following it.
  docker-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize tag version
        id: version
        run: echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      # QEMU for the arm64 image's final stage (apt-get). The .NET server is cross-published natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build unpushed Docker release candidate (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          build-args: WEIR_VERSION=${{ steps.version.outputs.plain }}
          tags: weir-release-candidate:${{ steps.version.outputs.plain }}-arm64
          cache-from: type=gha,scope=weir-release-arm64
          cache-to: type=gha,mode=max,scope=weir-release-arm64,ignore-error=true

  # The GitHub Release, from what windows-smoke and validate built. It does not wait for the Docker jobs, and
  # nothing in it touches the registry.
  publish-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Without ci-passed a commit CI never passed could ship; without windows-smoke there is no installer to release.
    needs: [ci-passed, golden-path, validate, windows-smoke]
    permissions:
      contents: write
      # For actions/attest-build-provenance below (OIDC signing, then recording the attestation on the repo).
      # Used only when the repository variable ATTEST_PROVENANCE is "true".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-web-dist
          path: ${{ github.workspace }}

      # scripts/check-release-version.mjs already refused anything but X.Y.Z or X.Y.Z-prerelease, so a hyphen
      # in the version means a pre-release.
      - name: Normalize tag version
        id: version
        run: |
          plain="${TAG#v}"
          echo "plain=$plain" >> "$GITHUB_OUTPUT"
          if [[ "$plain" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download Velopack release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-windows-velopack
          path: ${{ github.workspace }}/windows-artifact

      # Signed attestations are free on a public repository and need GitHub Enterprise Cloud on a private one, so
      # they are off until the repository variable ATTEST_PROVENANCE is "true".
      #
      # The exact bytes people download: the Windows files (SHA256SUMS.txt included, so it is covered too) and
      # the web build.
      - name: Attest provenance of the release files
        if: ${{ vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            weir-web-dist.zip
            windows-artifact/*

      - name: Prepare user-facing release notes
        run: |
          notes_file="docs/release-notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing required release notes file: $notes_file"
            echo "::error::Create it from docs/release-notes/TEMPLATE.md before tagging."
            exit 1
          fi
          cp "$notes_file" "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            weir-web-dist.zip
            windows-artifact/*
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}

  # The container image, rebuilt from the layers docker-candidate and docker-arm64 cached. It does not wait for the
  # Windows jobs, and nothing in it touches the Releases page.
  publish-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Without ci-passed a commit CI never passed could ship; without docker-candidate and docker-arm64 an image
    # that was never built and audited unpushed could reach ghcr.
    needs: [ci-passed, golden-path, validate, docker-candidate, docker-arm64]
    permissions:
      contents: read
      packages: write
      # For actions/attest-build-provenance below (OIDC signing, then recording the attestation next to the image
      # in ghcr). Used only when the repository variable ATTEST_PROVENANCE is "true".
      id-token: write
      attestations: write
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-release-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # scripts/check-release-version.mjs already refused anything but X.Y.Z or X.Y.Z-prerelease, so a hyphen
      # in the version means a pre-release.
      - name: Normalize tag version
        id: version
        run: |
          plain="${TAG#v}"
          echo "plain=$plain" >> "$GITHUB_OUTPUT"
          if [[ "$plain" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # Only needed if the cache below misses: the published build then re-runs the arm64 final stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Registry credentials and public tags are not created until every job this one needs has passed,
      # including the complete packaged browser/API audit of the unpushed candidate.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt from the layers docker-candidate and docker-arm64 cached. Only the version tag: the moving tags
      # move to it at the very end, once the image is known good. Provenance and an SBOM travel
      # with the image in the registry.
      - name: Publish release Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: WEIR_VERSION=${{ steps.version.outputs.plain }}
          cache-from: |
            type=gha,scope=weir-release-amd64
            type=gha,scope=weir-release-arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.plain }}

      # Signed attestations are free on a public repository and need GitHub Enterprise Cloud on a private one, so
      # they are off until the repository variable ATTEST_PROVENANCE is "true".
      #
      # The digest of the multi-architecture manifest list just pushed, so `gh attestation verify
      # oci://ghcr.io/<owner>/weir:<version>` proves the image came from this repo's own release build, as
      # it does for the release files.
      - name: Attest provenance of the Docker image
        if: ${{ vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify published Docker manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
        run: |
          manifest="$(docker manifest inspect "$IMAGE")"
          echo "$manifest"
          for arch in amd64 arm64; do
            if ! echo "$manifest" | grep -q "\"architecture\": \"$arch\""; then
              echo "::error::The published manifest has no linux/$arch image."
              exit 1
            fi
          done

      - name: Smoke test published Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.plain }}
        run: |
          docker rm -f weir-release-smoke >/dev/null 2>&1 || true
          docker run -d --name weir-release-smoke -p 9347:9347 \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            "$IMAGE"
          node scripts/wait-for-health.mjs --container weir-release-smoke

      - name: Cleanup Docker smoke container
        if: always()
        run: docker rm -f weir-release-smoke >/dev/null 2>&1 || true

      # Last, so a moving tag only ever names an image that passed its smoke. A copy of
      # the version's manifest list: both architectures, provenance and SBOM included, nothing rebuilt. Only a
      # stable release moves them: a release candidate is published under its version tag alone, so pulling
      # without a tag finds nothing until 1.0.0 rather than a candidate.
      - name: Move the moving image tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.plain }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "A release candidate moves no moving tags."
            exit 0
          fi
          for moving in "${VERSION%.*}" latest; do
            docker buildx imagetools create --tag "$IMAGE:$moving" "$IMAGE:$VERSION"
          done
